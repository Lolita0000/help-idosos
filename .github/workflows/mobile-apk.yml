name: Mobile — APK (Android)

on:
  # Entrega versionada: a tag dispara o build e dá nome à release.
  #   git tag -a v0.1.0 -m "..."  &&  git push origin v0.1.0
  push:
    tags: ["v*"]
  # Build avulso, para conferir que o app compila sem publicar release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # URL pública da API, definida na variável de repositório API_URL
      # (Settings → Secrets and variables → Actions → Variables).
      #
      # Sem valor de reserva, de propósito. O Expo grava EXPO_PUBLIC_* no bundle
      # em tempo de build, e src/core/index.ts escolhe a implementação por
      # `apiUrl ? createHttpApi(apiUrl) : localApi`. Qualquer valor aqui faz o app
      # nunca entrar em modo demonstração: se o endereço não responder, o APK
      # falha em toda chamada e não consegue nem cadastrar. Variável vazia é o
      # que mantém o APK funcional sem servidor.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Definir a versão
        id: versao
        working-directory: .
        run: |
          # Numa tag, github.ref_name é "v0.1.0". Num build avulso é o nome da
          # branch, e aí o APK fica marcado como "dev" e nenhuma release é criada.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "valor=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=sim" >> "$GITHUB_OUTPUT"
          else
            echo "valor=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "release=nao" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar se o APK sairá em modo demonstração
        if: vars.API_URL == ''
        run: |
          echo "::warning::A variável de repositório API_URL não está definida."
          echo "::warning::O APK sairá em modo demonstração, com os dados no próprio aparelho, sem falar com a API."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Gerar projeto Android (prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK de release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Nomear o APK com a versão
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "../out/elo-de-cuidado-${{ steps.versao.outputs.valor }}.apk"
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: elo-de-cuidado-${{ steps.versao.outputs.valor }}-apk
          path: out/elo-de-cuidado-${{ steps.versao.outputs.valor }}.apk
          retention-days: 30

      - name: Publicar o APK na release da tag
        if: steps.versao.outputs.release == 'sim'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.versao.outputs.valor }}
        run: |
          MODO="apontando para a API publicada"
          if [ -z "${{ vars.API_URL }}" ]; then
            MODO="em modo demonstração, com os dados no próprio aparelho"
          fi

          # A release pode já existir se a tag foi criada pela interface do GitHub.
          gh release view "$VERSAO" >/dev/null 2>&1 || gh release create "$VERSAO" \
            --title "Elo de Cuidado $VERSAO" \
            --notes "Aplicativo Android da entrega $VERSAO, $MODO.

          Baixe o arquivo \`elo-de-cuidado-$VERSAO.apk\` abaixo e instale no aparelho. É necessário permitir a instalação de fontes desconhecidas, porque o APK não vem de loja.

          Os arquivos \`Source code\` são gerados automaticamente pelo GitHub e não precisam ser baixados."

          gh release upload "$VERSAO" "out/elo-de-cuidado-$VERSAO.apk" --clobber
